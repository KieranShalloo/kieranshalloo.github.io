    full_width: true

  # 2. Redesign & Consistency Text Block
  - type: "text-block"
    main_title: "Goal"
    sections:
      # Section with NO subtitle
      - text: |
          As this game was a sequel, the initial groundwork was already completed for the project. Most of my work consisted of workshops, and conceptual vision to see how the game could extend from the boundaries of the initial project.

          The game was set in the Potions classroom subject so there were many sessions based around bringing the atmosphere of the classroom to the user.

