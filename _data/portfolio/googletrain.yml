title: "Google Trains"
description: "A UI/UX portfolio page showing work for Trainline by Kieran Shalloo"
theme_color: "var(--google)"

# Meta & Brief Header
meta_client: "Trainline"
meta_date: "2024"
meta_role: "Senior UX/UI Designer (contractor)"

brief: |
  To create ways to reassure passengers coming to Trainline from Google, communicating the positive propositions of the product.

page_sections:
  - type: "text-block"
    main_title: "Google Trains"
    sections:
      # Section with NO subtitle
      - text: |
          Google has introduced a Google train module, which allows users to search for their journeys on google rather than using the trainline service. Whilst good for the user the integration with the trainline allows users to go directly to the train search result without seeing any of the user benefits of using the Trainline platform.

      - subtitle: "Approaching the problem"
        text: |
          With a view to get this feature live as fast as possible we had a 5 day turn around to go from a
          concept to a design that was ready for development. I took the initiative to bring some elements of existing designs
          and concepts already in the design system to bring this to life. With one eye on the developer resource needed for this
          project it was all about quick wins and a scalable concept we could iterate on top of!

  - type: "image"
    name: "home/trainlineheader1920"
    alt: "Main image showing trainline concept design"
    full_width: true

  - type: "text-block"
    main_title: "Introduction to Google Users"
    sections:
      - subtitle: "Approaching the problem"
        text: |
          With this project needing an urgent turnaround, the first aspect was to be able to reuse some
          design system principles but to adjust them for the users coming from the Google Trains platform. Especially targeting
          the EU and USA customer markets.
          This, for me, meant that we should value the journey the user has made to come to the trainline
          above everything else.

          These users had come to the Trainline product from an external third party Google search module, and as such the goal
          was to try and sell the product features but with the key incentive was to not disrupt the
          user's main goal. A positive
          first exposure were essential especially in markets where the Trainline brand didn't have that
          big brand recognition.

  - type: "image"
    name: "googletrains/gtrainconcepts1920"
    alt: "Main image showing trainline concept design"
    full_width: true

  - type: "text-block"
    sections:
      - subtitle: "First iteration"
        text: |
          Adding the logic of what the user had been doing before they landed on this page, we knew that the user had to have clicked on a journey on the Google module to get to this screen. So I first brought this selected train journey to the very top of the page, ensuring it was clear and obvious that their journey was still right there for them to purchase.

          Underneath the selected journey I have added the biggest change for users from the google platform. By adding a reassurance message in an easy-to-access position which promotes the product and ensures the user of the benefits of using the Trainline platform.

          This clickable element will open a new modal which will be able to sell personalised benefits of the platform based on common highly rated features with positive feedback.

  - type: "image"
    name: "googletrains/gtrainmodal"
    alt: "Main image showing trainline concept design"
    full_width: true

  - type: "image-text"
    image_position: "left"
    media_style: "height: 60%; object-fit: contain;"
    video_webm: "/images/googletrains/gtrain_modal.webm"
    video_mp4: "/images/googletrains/gtrain_modal.mp4"
    subtitle: "Design Details"
    text: |
      I explored several design iterations, as shown above, before working with the design team to get the final design signed off. We tested the designs with users to ensure they met our product targets, working with an external research resource alongside Trainline’s internal research team.

      As the design was intended for multiple markets, I also worked closely with the UX copywriting team to finalise the copy for each locale, and with the localisation team on any required translations. Legal and marketing then signed off the final design and copy before public release.

  - type: "text-block"
    main_title: "Results and next steps"
    sections:
      - text: |
          This module had an instant effect on the conversion of users. We saw a drop in users clicking through from Google and then leaving the platform.

          We also unexpectedly saw an increase of users who came from google returning directly to the Trainline platform.

          As this was the first short term iteration for this product, as soon as the public saw this version I was working on the second iteration with a much stronger emphasis on the Trainline brand, starting to incorporate more rich media into the product through animations and motion design.

          The teams work across the whole project was one of the winners in Trainline's Tech and Product 2024 awards.

  - type: "image"
    name: "googletrains/award-1920"
    alt: "Main image showing trainline concept design"
    full_width: true
