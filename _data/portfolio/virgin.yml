title: "virgin"
description:
  "A UI/UX portfolio page showing work for Virgin Media by Kieran Shalloo"
theme_color: "var(--virgin)"

# Component Builder Engine
page_sections:
  # SECTION 1: Improve Billing Overview
  - type: "section"
    blocks:
      - type: "text-block"
        main_title: "Improve Billing"
        sections:
          - text: |
              There was a clear plan from the company perspective. Virgin Media wanted to empower its users to solve any issues themselves. With that in mind, we wanted to make journeys as easy as possible to understand.

              We never wanted users to struggle to find the information they needed. They also always wanted to be proactive in communication with the end-user.

      - type: "image"
        name: "virgin/yourbill"
        ext: "png"
        alt: "Virgin Media Your Bill dashboard and layout overview"

  # SECTION 2: Bill Overview & Breakdown
  - type: "section"
    blocks:
      - type: "text-block"
        sections:
          - subtitle: "Bill Overview"
            text: |
              The bill overview was the main landing section of the billing area, and as such, it was the first section I wanted to tackle. I wanted to utilise the working patterns of the already released sections of the experience. The last thing a user wants to do is to have to relearn the patterns of a website midway through.

              I introduced an easier way for the end-user to navigate throughout the months of their contract, as well as giving them the ability to compare the cost of this month to previous ones. The only way to do this on the existing website was to download each bill individually, so we made this an easy to see design element, which could then be expanded upon in the future, by incorporating additional spending.

              The work had huge success within this project, showing that **9/10 users** could solve the problem using the information we presented to them. The data for this result came from a **containment rate of 89.5% of users** clicking that they needed no additional help in the on-screen dialogue presented to them after their journey.

      - type: "media-grid"
        columns: 3
        items:
          - name: "virgin/BillOverview/virginmedia.billoverview"
            alt: "Virgin Media Bill Overview main dashboard view"
          - name: "virgin/BillOverview/virginmedia.billoverview.yourpackage"
            alt: "Virgin Media Bill Overview your package summary section"
          - name: "virgin/BillOverview/virginmedia.billoverview.yourextras"
            alt: "Virgin Media Bill Overview extra add-ons breakdown"
            full_width: false

  # SECTION 3: Bill Explainer
  - type: "section"
    blocks:
      - type: "text-block"
        sections:
          - subtitle: "Bill Explainer"
            text: |
              With a big change in the way the billing area looked and functioned, I pitched the idea of a walkthrough guide for both new customers and people who were being brought through into the new version of billing. I was inspired by the onboarding style of phone applications, which allow a user to learn about new sections of the UI as and when they needed them.

              We had some difficulties with being able to explain certain features as the user may not have interacted with their bill in a particular way, and I didn’t want a new area to pop up in the future without an explanation, whilst also not wanting to force a new onboarding the next time a customer opened the web page.

              In the end, I decided on using real billing data but showing all the possible fields a user may face. This allowed them to see every area they might interact with in the future, which could also be hidden when they finished the onboarding session. I took the prototype through a few iterations of user testing, focusing on what a customer would expect to be shown, as well as incorporating as much data tracking from the existing website.

              This in turn ensured that the most clicked items were shown to a user so they knew where to find them in future.

      - type: "image"
        name: "virgin/billexplainer"
        ext: "jpg"
        alt:
          "Virgin Media Bill Explainer full desktop and mobile feature showcase"
        full_width: true

      - type: "media-grid"
        columns: 3
        items:
          - name: "virgin/BillExplainer/virginmedia.BillExplainer2"
            alt: "Virgin Media Bill Explainer step one onboarding view"
          - name: "virgin/BillExplainer/virginmedia.BillExplainer5"
            alt: "Virgin Media Bill Explainer step two interactive breakdown"
          - name: "virgin/BillExplainer/virginmedia.BillExplainer9"
            alt: "Virgin Media Bill Explainer final completion step"

  # SECTION 4: Notifications & Anonymous Journeys
  - type: "section"
    blocks:
      - type: "text-block"
        sections:
          - subtitle: "Notifications"
            text: |
              Notifications gave us the opportunity to give warning of events to the users when they arrive on pages.

              I wanted to ensure that users were aware of changes to their bills, as well as reassure them when they had actioned something on the website concerning approach billing. I decided to use the notification pattern that was in use in other areas of the project. By introducing a level system of notifications, we could create easy-to-dismiss notifications when no user action is required up to emergency customer interaction events.

              Long term these could also be used to make users aware of future billing events. An example is a higher than expected bill due to On Demand content being purchased previously. By solving the problem of unexpectedly high costs, we make the user feel more in control of their billing.

          - subtitle: "Anonymous Journeys"
            text: |
              Existing data showed that the number of users navigating to the billing area from outside the Virgin Media website was skewed dramatically towards not being logged in. We wanted to ensure that the high number of users in a logged-out state could still try to solve their problem before being pushed to log in. With that in mind, I reimagined the journeys for anonymous users. These designs were just about to be launched as I joined the project so I made them a focus in the first few weeks.

              I reduced the number of clicks a user would need to act before coming to their selected page by improving the flows to a more logical paginated state, at the same time reducing some of the videos and additional media which was slowing the web page down and which data showed was not being interacted with in any way.

      - type: "image"
        name: "virgin/Anonymous/virginmedia-anonymous-1920"
        alt: "Virgin Media anonymous user landing page and streamlined flow"
        full_width: true

  # SECTION 5: Payments Suite
  - type: "section"
    blocks:
      - type: "text-block"
        main_title: "Allow Users To Pay Their Bills"
        sections:
          - text: |
              Alongside giving users a way to see and interact with their bill, a goal of the project was to allow users to also pay their bill or any fines they may have incurred in their account. To do this we explored various aspects of not just the actual bills, but how could we ensure that the customer knew any upcoming payments which were due to be paid in the near future.

      - type: "image"
        name: "virgin/virginmedia-PayNowDesktop-1920"
        alt: "Virgin Media Pay Now desktop interface and upcoming payments view"
        full_width: true

      - type: "text-block"
        sections:
          - subtitle: "Quick Pay"
            text: |
              Being able to pay the bill was one of the most important aspects of the whole project, but users were constantly frustrated with the existing usability of paying their bill.

              I simplified the page, enabling the user to save their most common cards, to bring it in line with industry standards.

      - type: "media-grid"
        items:
          - name: "virgin/QuickPay/virginmedia-QuickPay-Before"
            alt: "Virgin Media Quick Pay interface comparison before redesign"
          - name: "virgin/QuickPay/virginmedia-QuickPay-After"
            alt:
              "Virgin Media Quick Pay simplified card saving interface after
              redesign"

      - type: "text-block"
        sections:
          - subtitle: "Anonymous Payments"
            text: |
              By utilizing the end user's secure access, we created the ability for a user to pay their bill without being logged into their account. Through user testing we noticed this feature was commonly requested, most notably in two use cases: users with elderly relatives that they took responsibility for, and parents with children at university.

              This got brought into a short sprint of work as it was seen as low effort for an instant improvement to the experience.

      - type: "media-grid"
        columns: 3
        items:
          - name: "virgin/Collections/virginmedia.OustandingAmount1"
            alt: "Virgin Media outstanding amount view for anonymous payments"
          - name: "virgin/Collections/virginmedia.OustandingAmount2"
            alt: "Virgin Media secondary outstanding payment summary screen"
          - name: "virgin/Collections/virginmedia.Collections6"
            alt: "Virgin Media collections and balance overview interface"

      - type: "text-block"
        sections:
          - subtitle: "Partial Payments"
            text: |
              For a subset of users, paying their bills in full is not financially achievable.

              These more vulnerable customers were given the ability to make a partial payment, allowing them to pay a percentage of their bill with the rest being added onto a future payment.

              I explored different variations of micro-interactions to enhance the feature. By leading the eye with animation, it ensures that the user is able to understand the process clearly.

  # SECTION 6: Fullscreen Scroller
  - type: "fullscreen-scroller"
    scroller_key: "virginscroller"

  # SECTION 7: Log-In Authentication & OTP
  - type: "section"
    blocks:
      - type: "text-block"
        main_title: "Improving Logged In Abilities"
        sections:
          - text: |
              Virgin Media had a problem that was affecting the ability to interact with customers in a way which allowed them to solve problems. It was noted on user analytics that many people were not logged into the service when using the Help sites.

              We had data which showed that customers were unwilling to log in due to the conflicting nature of the user data Virgin held—the Virgin Mobile information was separate from Virgin Media, which was separate again from Virgin Money or Virgin Trains.

              This information was not shared across the different businesses, causing customer frustration with forgotten passwords and usernames.

          - subtitle: "Logging In"
            text: |
              With the first releases of the Virgin Care updates, there was no way for a user to log in. This was causing issues for the initial subset of users who were taken through the new pages.

              There was work going on in the background to release a Log In phase, but it not being available caused major issues for the Billing team as we had to force the user through the older experience to log in before redirecting them back to the new design—a frustrating, incohesive, and incomplete experience.

              I created a short-term approach as a stopgap to solve the problem for my team, ensuring that users could continue their journeys without needing to rely on external sites while maintaining Virgin Media’s strict security protocols. This feature improved monthly users completing a Log In journey by 35.8% compared to the existing live site.

      - type: "image"
        name: "virgin/virginmedia-PayNowCode-1920"
        alt: "Virgin Media secure quick authentication and code entry view"
        full_width: true

      - type: "text-block"
        sections:
          - subtitle: "One Time Password"
            text: |
              The usage stats of the project showed that existing customers were logging into the site less than 20% of the time.

              Feedback from users showed a variety of problems with the login journey, but due to security constraints, these could not be fixed in a short timeframe.

              Our data team reported that the main issue users noted was forgetting their username and/or password, with 9/10 customers stating they would rather exit the site than reset their credentials.

              With this in mind, I led a short spike to investigate an alternative login mechanism. After ideation sessions with the wider agile team, I settled on a One Time Password entry, allowing users to receive a code via SMS or Email to log into their account. In line with Virgin Media security protocols, this was restricted to their home WiFi network associated with the account to protect private information.

              The first iteration of this feature was used to allow users to pay their bill as a proof of concept on both the design and technical side, receiving unanimous approval in customer feedback sessions.

      - type: "image"
        name: "virgin/OTP/virginmedia.OneTimePassword.Flow"
        full_width: true
        alt: "Virgin Media One Time Password SMS verification flow screen"

      - type: "media-grid"
        columns: 4
        items:
          - name: "virgin/OTP/virginmedia.OneTimePassword1"
            alt: "Virgin Media outstanding amount view for anonymous payments"
          - name: "virgin/OTP/virginmedia.OneTimePassword2"
            alt: "Virgin Media secondary outstanding payment summary screen"
          - name: "virgin/OTP/virginmedia.OneTimePassword3"
            alt: "Virgin Media collections and balance overview interface"
          - name: "virgin/OTP/virginmedia.OneTimePassword10"
            alt: "Virgin Media collections and balance overview interface"

  # SECTION 8: Metrics & Results
  - type: "section"
    blocks:
      - type: "text-block"
        main_title: "Results And Learnings"
        sections:
          - text: |
              As detailed user feedback remains covered by NDA, I can share high-level stats and outcomes from our user testing sessions:

              * **200% increase** in user satisfaction across the billing features compared to legacy sections.
              * **93.4% positive response rate** to the Quick Pay feature during user testing sessions, with participants highlighting its clarity and speed.
              * **90% task completion rate** without requiring call-center intervention, fulfilling the primary business goal of the initiative.
