title: "WWE Network"
description:
  "Senior UX/UI design work for the award-winning WWE Network relaunch."
theme_color: "var(--wwe)"

# Component Builder Engine
page_sections:
  # 1. Hero Screen Tile Banner
  - type: "image"
    name: "wwe/tileangle"
    ext: jpg
    alt:
      "Angled 3D display of WWE Network interface tiles across multiple device
      screens"
    full_width: true

  # 2. Redesign & Consistency Text Block
  - type: "text-block"
    main_title: "Redesign"
    sections:
      - text: |
          Coming aboard a project, an issue quickly discovered with the deliverables was a huge amount of inconsistency across designs. With this in mind, working alongside the Director of Experience and Design on the WWE side, we started the work of creating an atomic design system to cut down the number of issues discovered and secondly to reduce the number of visual images developers needed to create the vision of the designs.

          We created a component-based design system and used third-party tools such as Zeplin and Abstract, allowing developers to instantly see the specifications of the selected components whilst retaining version history.

          This gave more time to focus on the conceptual design challenges rather than repetitive smaller tasks.

      - subtitle: "Consistency"
        text: |
          The WWE Network is a streaming service which allows users to view any available content from WWE’s 70-year history. Subscribers can use the interface to invoke any event and any match from the library to watch on-demand as well as having live access to a 24-hour linear streaming channel showing curated popular content.

          Alongside historical events, customers can also watch live exclusive WWE events as well as backstage documentaries.

          When I was brought aboard the project there was a base level of design work completed which allowed me to expand upon a foundation and start to explore a more creative next step for the project.

  # 3. Design System Pillars (Symbols, Buttons, Devices)
  - type: "text-details"
    items:
      - subtitle: "Symbols"
        text:
          "By creating a recurrent component-based design system we could
          simplify the work across projects as well as devices. We ensured that
          the components related directly to the same components used on the
          developer side to keep the project simple and the naming conventions
          consistent."
      - subtitle: "Buttons"
        text:
          "Across the UI the buttons for the experience were recreated to be
          easier to use and to work across devices. By using expanding buttons
          we could create one component which covered every use case without
          remaking the design each time."
      - subtitle: "Devices"
        text:
          "With an On Demand service the primary action is usually to play
          content. I spent a large chunk of time trying to make the playback
          experience consistent across devices. The user should always face a
          common UX experience regardless of where they are watching content."

  # 4. Styleguide Overview
  - type: "image"
    name: "wwe/styleguide"
    ext: "png"
    alt:
      "Comprehensive UI styleguide showcase detailing typography, colour
      palettes, and core design elements"
    full_width: true

  # 5. Bringing Fans Closer & Downloads Intro
  - type: "text-block"
    main_title: "Bringing the fans closer"
    sections:
      - text: |
          The fans are the central focus of the WWE Network redesign and there was extensive user research into exactly what the fans wanted from the service.

          One such factor that appeared was that the wrestlers themselves are one of the most intriguing parts of the whole product. WWE decided that a section of the app should be based on the superstars themselves, giving users clear and easy access to information about their stars as well as easy access to career-defining moments and achievements.

          Alongside this, we also set to work on creating journeys to content such as Biographies, Champions, and timelines of championships as well as extended views of the WWE Superstars' careers.
      - subtitle: "Downloads"
        text: |
          We wanted to give users the ability to download content that they were paying for. I created an interactive prototype to showcase how that would work.

  # 7. High-Fidelity Prototype Feature Banner
  - type: "media-grid"

    items:
      - name: "wwe/downloading"
        alt:
          "Interface mockup showing active video content download progress
          indicators"
      - name: "wwe/downloads"
        alt: "Offline downloads library screen listing saved matches and shows"

  - type: "image"
    name: "wwe/downloadflow"
    ext: "png"
    alt:
      "User journey flow chart depicting step-by-step navigation for downloading
      offline content"
    full_width: true

  # 8. Articles, News & Clips Text
  - type: "text-block"
    sections:
      - subtitle: "Articles / News"
        text: |
          We also set up the site map to allow the latest news and articles based on the WWE superstars to be integrated into the app. This allowed us to show the top information from the WWE.com homepage as well as hyperlink out to the website, which would then have additional information and other areas of interest for the end user such as tickets and the WWE Shop for merchandise.

  - type: "image"
    name: "wwe/article"
    ext: "png"
    alt:
      "High-fidelity screen design of integrated news articles and superstar
      update feeds"
    mobile_name: "wwe/article-mobile"
    full_width: true

  - type: "text-block"
    sections:
      - subtitle: "Clips / Highlights"
        text: |
          Utilising the player functionality allowed us to bring highlights from the latest events for the selected wrestler, allowing the user to jump directly into the match involving their favourites. This was seen as a great way for the user to interact with the huge library and opened the doors to collections and older content which could be pushed from a business perspective.

