# Component Builder Engine
page_sections:
  - type: "text-block"
    main_title: "Project Goal"
    sections:
      - text: |
          As it expanded its reach into the UK television market, YouView wanted to give their customers a way to remotely record the TV shows and films they enjoy on the go.

          A feature much requested by existing users, this app would be the first step into pushing the product to a much wider audience and being able to take the YouView experience out of the home.

  - type: "text-block"
    sections:
      - subtitle: "User Research"
        text: |
          Work started with the YouView mobile app with the use of personas; we adjusted a few variables in relation to taking the product onto the small screen in the form of mobile phones and tablets.

          These new personas were created with the help of external agencies who we also outsourced our initial user research to.

          This company was brought in various times throughout the project to relay feedback and to help shape our vision of the product.

  - type: "image"
    name: "mobile/mobile-hero"
    alt:
      "High-fidelity mobile application hero screen showcasing the YouView
      remote record interface on a smartphone"
    full_width: true

  - type: "text-block"
    main_title: "Design Process"
    sections:
      - text: |
          The first step in our thinking was how best to replicate the journeys the users had been accustomed to when using the product in the home.

          We wanted a consistent pattern in both platforms whilst also taking both the Apple and Android guidelines and creating consistency with the overall branding and UI of our existing work.

          The information architecture of the app was decided early, creating a strong foundation of hierarchy and a user-centred approach to delivering the right information at the right time in order to benefit our users. Working alongside the Lead Interaction Designer, we collaborated on various aspects of the app, bouncing ideas with each other and using an agile approach to the workflow, creating a dynamic working relationship leading to furthering ideas and concepts.

  - type: "text-block"
    main_title: "Content Discovery"
    sections:
      - text: |
          Industry research in conjunction with user feedback told us that the discovery of new content was one of the pain points people had when using TV products. With that in mind, we created the idea of a whole area relating to discovering the content you would like to watch when you got home, allowing the user to set the recordings for the evening.

          By splitting the content into relevant categories, it allowed us to highlight content first and foremost for the user whilst also having a quick shortcut to see all of the content.

          The concept came from the idea of allowing the user to scroll leisurely through the content available to them at any time, with actions available on a long press of the content. I also wanted to ensure that the user wasn’t overwhelmed with choice, and so we limited the carousels to 10 items with a SEE ALL call to action. This also improved page loading on the app as the back-end service didn’t have to request so many images at once.

