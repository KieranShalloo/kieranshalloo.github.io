  - type: "text-block"
    main_title: "Designing for multiple screens"
    sections:
      - text: |
          As the app gained popularity inside our user base, there was a business decision to push the app further with the introduction of a tablet mode, initially with the iPad and then as the opportunity arose moving onto Android tablets.

          A key point with making a project for second screen devices was using the screen estate in the correct way and when creating the application with the larger tablet form in mind we wanted to ensure that we could create a more lean-back experience. The goal was to create a bespoke experience for tablets to allow us to show more on screen at one time utilizing the bigger screen size.

