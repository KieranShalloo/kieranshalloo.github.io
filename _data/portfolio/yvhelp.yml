      - name: "help/help-concept3"
        alt: "Wireframe mapping search queries and error code lookup flows"
      - name: "help/help-concept4"
        alt:
          "Detailed layout wireframe for help articles and integrated video
          player views"

  - type: "image"
    name: "help/help-flows"
    alt:
      "Comprehensive user flow diagram mapping support paths and diagnostic
