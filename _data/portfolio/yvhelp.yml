title: "YouView Help"
description:
  "A UI/UX portfolio page showing work for YouView Help by Kieran Shalloo"
theme_color: "var(--youview)"

# Component Builder Engine
page_sections:
  # 1. Problems & Goals
  - type: "text-block"
    main_title: "Problems & Goals"
    sections:
      - text: |
          The release of the next generation YouView UI had left the help app feeling out of date and disconnected from the main user experience.

          The help app, designed alongside the initial launch in 2012, was clunky, slow, and designed in a way that was no longer applicable for our needs.

          Its usability was challenged, and our data showed that we were receiving more calls and social media posts regarding problems that could easily be solved with an improvement to the help app.

  - type: "image"
    name: "help/help-hero"
    alt:
      "YouView help application hero screen displaying redesigned user support
      navigation on a television interface"
    full_width: true

  - type: "text-block"
    sections:
      - subtitle: "Goals"
        text: |
          The goal of the help app was to create a convenient way to solve issues a user might face. We didn't want to just reskin the existing help app; we wanted to create a great experience that would help a user in a stressful time.

  - type: "text-details"
    items:
      - subtitle: "Create a consistent user journey matching the rest of the UI"
      - subtitle: "Use a scalable template-based system for iterative design"
      - subtitle: "Lower the amount of calls and support-site hits"

  - type: "text-block"
    sections:
      - subtitle: "Role & responsibilities"
        text: |
          I was placed into the project as the lead designer and worked collaboratively with both a junior UX designer and an intern from the visual design team, allowing them to progress designs and involving them in every stage of the process.

          In addition, other designers were involved and contributed to ensure a collaborative working environment.

          I stepped away from active design on this project after achieving stakeholder buy-in, as the project transitioned into our agile backlog.

  # 2. Project Kickoff
  - type: "text-block"
    main_title: "Project kickoff"
    sections:
      - subtitle: "Workshops and insights"
        text: |
          At the beginning of the project, the whole agile cluster was brought together for a kickoff session.

          Bringing all team members together—developers, testers, and others—gave everyone an opportunity to brainstorm issues and fostered a strong sense of project ownership across the board.

          We also incorporated information gathered by our viewer support team, as well as insights gained from social media, to help guide the conversation and keep us on track.

          This initial kickoff opened up dialogue within the team, and before long, it evolved into a team-based user testing session. People began identifying usability edge cases that hadn't even been reported by actual users yet, allowing us to make the product even better.

  - type: "text-details"
    items:
      - subtitle: "I can't find the right article"
      - subtitle: "I have to open each article to see if it is the right one?"
      - subtitle: "Why can't it just show me how to fix this?"

  - type: "text-block"
    sections:
      - subtitle: "Reevaluating the issues"
        text: |
          All this work investigating user problems led the team to re-examine the initial brief.

          Our insights indicated that the original brief missed the core issue: it wasn't just that the customer's journey was difficult, but that they were struggling to find relevant content in the first place. This led to frustration, prompting customers to phone support or air their grievances on social media.

          We then had to ask ourselves: how can we present not just the best content, but the right content for the customer at the exact moment they need it?

  # 3. Redesigning
  - type: "text-block"
    main_title: "Redesigning"
    sections:
      - subtitle: "Having the right information"
        text: |
          A customer doesn't always need technical details on what is wrong; sometimes they just want it fixed quickly.

          We wanted to eliminate hurdles for the user and make it fast and simple for them to resolve issues and get back to watching their favourite content.

          Through our initial whiteboard sessions, we established key goals for the redesigned help app:
          - Making sure all error codes are directly linked to corresponding help articles
          - Placing the most popular content at the forefront of the app
          - Prioritising video guides as the primary visual format users encounter
          - Ensuring support options are effortless to locate

      - subtitle: "Concepts & User Flows"
        text:
          "Iterating on core user journeys to map out clear pathways from issue
          discovery to final resolution."

  - type: "media-grid"
    columns: 2
    items:
