      "Detailed troubleshooting flow chart illustrating step-by-step error code
      resolution"
    full_width: true

  # 4. Prototyping & User Testing
  - type: "text-block"
    main_title: "Prototyping & User Testing"
    sections:
      - subtitle: "Interactive Prototypes"
        text: |
          We built interactive prototypes to test our new component structures and validate navigation patterns with real users.

  - type: "media-grid"
    columns: 2
    items:
      - name: "help-home-scroll"
        ext: "gif"
        alt:
          "Animated prototype preview demonstrating scrolling behavior on the
          redesigned YouView help home screen"
      - name: "help-topic-scroll"
        ext: "gif"
        alt:
          "Animated prototype preview showcasing help topic detail view and
          embedded video playback"

  # 5. 3D Art Direction
  - type: "text-block"
    main_title: "3D Art Direction"
    sections:
      - subtitle: "Visual Context & Art Direction"
        text: |
          Working with a group of freelance 3D artists, I led their direction for the production of images shown to the user on topic pages. I wanted to ensure that the images visually correlated with the device settings area where issues occurred, creating an intuitive mental link between the device setting and the help topic.

  - type: "media-grid"
    columns: 2
    full_width: true
    items:
      - name: "help/help-3d-bg1"
        alt:
          "Custom 3D rendered graphic asset representing system settings support"
      - name: "help/help-3d-bg2"
        alt:
          "Custom 3D illustration asset designed for network connection
          troubleshooting topics"
      - name: "help/help-3d-bg3"
        alt:
          "3D graphic element representing hardware audio and display settings"

  # 6. Final Screens & Specs
  - type: "text-block"
    main_title: "Final Screens"
    sections:
      - subtitle: "Delivered UI Design"
        text: |
          The final delivered user interface for the YouView help application, bringing together streamlined navigation, video-first support guides, and integrated 3D artwork.

  - type: "media-grid"
    columns: 2
    full_width: true
    items:
      - name: "help/help-new-home2"
        alt: "Final delivered YouView help home screen interface layout"
      - name: "help/help-new-topic2"
        alt:
          "Final delivered help topic detail screen featuring an embedded
          support video"
      - name: "help/help-new-topic5"
        alt: "Final delivered troubleshooting step-by-step resolution view"
      - name: "help/help-contact"
        alt: "Final delivered customer support contact and phone options screen"

  - type: "text-block"
    sections:
      - subtitle: "Detailed specs"
        text: |
          I created detailed documentation during this project to communicate specifications for the front-end development team as well as our test team, covering both manual and automated testing requirements. Final delivery consisted of visual design specs via Zeplin, alongside detailed user flows and journeys uploaded to product management applications to track development progress.

          I also tracked development milestones through regular sign-off points entered into the production roadmap. This gave me the ability to present work-in-progress deliverables to senior management teams and incorporate feedback into the wider design cluster.

  - type: "media-grid"
    columns: 2
    full_width: true
    items:
      - name: "help/help-action-panel-specs"
        alt:
          "Design specification layout showing UI padding, typography, and
          component states for action panels"
      - name: "help/help-new-action-panel-specs"
        alt:
          "Refined design specification sheet detailing interactive button
          states and spacing"
      - name: "help/help-new-error-specs"
        alt:
          "Technical specification view for error state handling and messaging
          components"

  - type: "text-block"
    sections:
      - subtitle: "ISP versions"
        text: |
          Like the rest of the YouView interface, there is a requirement to create ISP-specific versions of any feature to better represent shareholder brands and maintain a seamless experience for their customers. As such, we incorporated both BT and TalkTalk interface colour schemes and branding rules into the project.

  - type: "media-grid"
    columns: 2
    full_width: true
    items:
      - name: "help/help-new-home-bt"
        alt:
          "BT-branded variant of the YouView help home screen featuring custom
          brand accent colours"
      - name: "help/help-new-home-tt"
        alt:
          "TalkTalk-branded variant of the YouView help home screen featuring
          corresponding brand styling"

  # 7. Results & Conclusions
  - type: "text-block"
    main_title: "Results & Conclusions"
    sections:
      - text: |
          These results come from the user testing sessions with the final designs using a micxture of existing customers from all three user bases, BT TT and retail.

          This coming from in house user testing means the results are skewed and as such would not be indicative of a wider release

  - type: "card-grid"
    columns: 3
    items:
      - text:
          "More than 80% of participents would use the help app as thier first
          point of call in the event of an error "
      - text:
          "The most hughly regarded feature was the acess to most common issues"
      - text:
          "The imagery relating to the settings area was also highlighted as a
          way to quickly link areas "

  - type: "text-block"
    sections:
      - subtitle: "Next Steps"
        text: |
          This project was not supposed to be the final version, it is onlyt the first version of an iterative agile process in making the help app as useful as a feature for the customer We took feedback and are ensuring the product is the best experience it can be
