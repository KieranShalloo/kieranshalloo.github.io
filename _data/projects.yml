- id: "dancestar-party"
  title: "Dance Star Party"
  description:
    "A UI/UX portfolio page showing work for DanceStar Party by Kieran Shalloo"
  project_header_id: "dancestar"
  meta:
    brief:
      "As part of my contracted time at Sony London Studios, I was part of the
      team that worked on the DanceStar Party rhythm game. This game brought the
      technology of the SingStar party dance game to a separate full-fledged
      game. The goal of the game was to copy the dance moves shown on screen
      using the PlayStation Move controller—the closer to the shown move, the
      more points for the user."
    client: "Sony London Studio"
    project_date: "2012"
    role: "Graphic Designer (Contract)"

