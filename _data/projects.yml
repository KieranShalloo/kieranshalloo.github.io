- id: "wwenetwork"
  title: "WWE"
  theme_color: "var(--wwe)"
  description:
    "A UI/UX portfolio page showing work for WWE Network by Kieran Shalloo"
  project_header_id: "wwenetwork"
  meta:
    brief:
      "WWE relaunched its On Demand video service in Q2 of 2019. The app
      showcases live wrestling events as well as the whole past catalogue of WWE
      shows, original content related to sports entertainment, and short-form
      clips. I was brought onboard this project via an agency which I had
      previously worked with. The WWE Network is spread across Responsive Web,
      Mobile, and TV so my previous experience was a plus point. I worked
      extremely closely with the client side through all instances of this
      project and took designs from concept through to support for the
      development of the features."
    agency: "Massive Interactive / Deltatre"
    client: "World Wrestling Entertainment"
    project_date: "2020"
    role: "Senior UX/UI Designer (contractor)"

