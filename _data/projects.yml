- id: "yv-help"
  layout: default
  title: "Yvhelp"
  dark_theme: false
  description: "A UI/UX portfolio page showing work for YouView Help by Kieran Shalloo"
  project_header_id: "yvhelp"
  meta:
    brief: "Update the Help app on YouView platform to bring it more in-line with the Next Generation user experience. Ensure that the design correspond with the YouView, BT and TalkTalk support sites whilst retaining the ability for users to troubleshoot their problems. Customers who currently use the service but may have difficulty using the product due to sight-related issues. Customers who wish to have a more accessible TV service. The legacy YouView help menu was built as a way for customers to solve the problems they were facing in their own time. The depreciation of the legacy UI and the move to the Next Generation interface pushed forward the need to bring the Help App into line with the revamped service. I was chosen to lead this project working alongside a junior designer and an intern, helping to guide them towards a final product"
    client: "YouView TV Ltd"
    project_date: "2018-2019"
    role: "Lead Product Designer"

