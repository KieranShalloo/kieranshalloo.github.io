- id: "yvhelp"
  title: "YouView Help"
  slug: "yvhelp"
  url: "/portfolio/yvhelp/"
  theme_color: "var(--youview)"
  description: "In-app customer support and help experience design for YouView."
  subtitle: "Supporting BT and TalkTalk customers on YouView"
  meta:
    brief:
      "Update the Help app on the YouView platform to bring it more in line with
      the Next Generation user experience. Ensure that the design corresponds
      with the YouView, BT and TalkTalk support sites whilst retaining the
      ability for users to troubleshoot their problems.\n\nCustomers who
      currently use the service may have difficulty using the product due to
      sight-related issues, or simply wish to have a more accessible TV
      service.\n\nThe legacy YouView help menu was built as a way for customers
      to solve the problems they were facing in their own time. The deprecation
      of the legacy UI and the move to the Next Generation interface pushed
      forward the need to bring the Help App into line with the revamped
      service.\n\nI was chosen to lead this project working alongside a junior
      designer and an intern, helping to guide them towards a final product."
    client: "YouView TV Ltd"
    project_date: "2018-2019"
    role: "Lead Product Designer"
  image:
    alt: "YouView on-screen help interface"
    width: 1024
    height: 676
    aspect_ratio: "4:3"
    avif: "/images/home/YVhelpheader414.avif"
    webp: "/images/home/YVhelpheader414.webp"
    jpg: "/images/home/YVhelpheader414.jpg"
    desktop_avif: "/images/home/YVhelpheader1920.avif"
    desktop_webp: "/images/home/YVhelpheader1920.webp"
    desktop_jpg: "/images/home/YVhelpheader1920.jpg"

  logo: "/images/about/about-youview.svg"

