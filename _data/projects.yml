  project_header_id: "wwe"
  meta:
    brief: "WWE relaunched it’s On Demand video service in Q2 of 2019. The app showcases live wrestling events as well as the whole past catalogue of WWE shows, Original content related to Sports Entertainment and short-form clips. I was brought on board this project via an agency which I had previously worked with. The WWE Network is spread across Responsive Web, Mobile and TV so my previous experience was a plus point. I worked extremely closely with the client-side through all instances of this project and took designs from concept through to support for the development of the features."
