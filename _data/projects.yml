- id: "netflix"
  title: "Netflix"
  description:
    "A UI/UX portfolio page showing work for Netflix advertising campaign by
    Kieran Shalloo"
  project_header_id: "netflix"
  meta:
    brief:
      "I was tasked with creating a short animation to promote the arrival of
      the Netflix service on the YouView platform. I worked firstly with a
      contracted motion designer to create the initial vision, although I
      personally took the project through from that point to final completion.
      There was a lot of communication from not only the internal team but also
      with the Netflix team to ensure that it promoted the platform. This was
      seen across London’s Piccadilly Circus during the peak Christmas period."
    client: "YouView & Netflix UK"
    project_date: "2015-2016"
    role: "Motion Graphics, Art Direction"

