<div class="containerfluid project-banner my-5">
    <div class="row justify-content-center mx-0">
        <div class="col-12 px-0 text-center">
            <picture>
                {% if include.data.webp_src %}
                <source srcset="{{ include.data.webp_src }}" type="image/webp" />
                {% endif %}
                <img src="{{ include.data.src }}"
                    alt="{{ include.data.alt | default: 'Case study presentation graphic' }}" class="img-fluid w-100"
                    loading="lazy" decoding="async" style="max-height: 80vh; object-fit: cover;" />
            </picture>
            {% if include.data.caption %}
            <p class="text-muted small mt-2 px-3">{{ include.data.caption }}</p>
            {% endif %}
        </div>
    </div>
</div>
