<div class="container my-5">
    <div class="row g-4 align-items-start justify-content-center">
        {% for asset in include.data.assets %}
        <div class="col-12 col-md-{{ include.data.col_size | default: 6 }}">

            <!-- Condition A: If it is a Text Column -->
            {% if asset.is_text_block %}
            <div class="text-block-cell p-3">
                {% if asset.heading %}
                <h4 class="text-center">{{ asset.heading }}</h4>
                <div class="d-flex justify-content-center mb-3">
                    <svg width="100" height="8">
                        <rect style="fill: {{ include.color | default: 'var(--dark)' }}" rx="4" x="0" y="0" width="100"
                            height="4" />
                    </svg>
                </div>
                {% endif %}
                <p class="text-center">{{ asset.text }}</p>
            </div>

            <!-- Condition B: If it is an Image Column -->
            {% else %}
            <div class="image-block-cell position-relative">
                <picture>
                    {% if asset.webp %}
                    <source srcset="{{ asset.webp }}" type="image/webp" />
                    {% endif %}
                    <img src="{{ asset.jpg }}" alt="{{ asset.alt | default: 'Project asset display' }}"
                        class="img-fluid w-100 rounded shadow-sm" loading="lazy" decoding="async" />
                </picture>
                {% if asset.caption %}
                <p class="text-muted small text-center mt-2">{{ asset.caption }}</p>
                {% endif %}
            </div>
            {% endif %}

        </div>
        {% endfor %}
    </div>
</div>
