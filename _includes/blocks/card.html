{% comment %} Individual Card Component {% endcomment %}
<div class="card h-100 shadow-sm border-0"
    style="background-color: var(--card-bg); color: var(--card-text); transition: background-color 0.3s ease, color 0.3s ease;">
    <div class="card-body d-flex flex-column justify-content-center p-4">
        <!-- Title / Subtitle forced to the project accent brand colour -->
        <h5 class="card-title text-md-center  mb-3" style="color: var(--project-accent);">
            {{ include.item.title | default: include.item.subtitle }}
        </h5>

        <!-- Description reads the inverted light/dark mode text color -->
        <p class="card-text text-md-center mb-0" style="color: inherit; opacity: 0.85;">
            {{ include.item.text | default: include.item.description }}
        </p>
    </div>
</div>
