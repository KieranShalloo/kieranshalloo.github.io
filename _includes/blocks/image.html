{% assign img_width = include.block.width | default: "1440" %}

<div class="container-fluid portfolio-component">
    <div class="row justify-content-center">
        <div class="col-12" style="max-width: {{ img_width }}px;">
            <div class="portfolio-media-container">
                {% include responsive-image.html
                name=include.block.name
                alt=include.block.alt
                sizes=true
                %}
            </div>
            {% if include.block.caption %}
            <figcaption class="figure-caption text-center mt-2">
                {{ include.block.caption }}
            </figcaption>
            {% endif %}
        </div>
    </div>
</div>
