{% assign is_full = include.block.full_width | default: false %}

<div
    class="{% if is_full %}container-fluid p-0 my-5 full-bleed-block{% else %}container my-5{% endif %} portfolio-component">
    <div class="row g-0 justify-content-center">
        <div class="col-12">
            <div class="portfolio-media-container">
                {% include responsive-image.html
                name=include.block.name
                mobile_name=include.block.mobile_name
                alt=include.block.alt
                class="img-fluid w-100 d-block"
                %}
            </div>
            {% if include.block.caption %}
            <figcaption class="figure-caption text-center mt-2">
                {{ include.block.caption }}
            </figcaption>
            {% endif %}
        </div>
    </div>
</div>
