<div class="containerfluid my-5">
    <div class="container">
        <div class="row">
            <!-- Section Title Area -->
            {% if include.data.main_title %}
            <div class="col-md-8 offset-md-1 mb-3">
                <h2 style="color: {{ include.color | default: 'var(--dark)' }}">{{ include.data.main_title }}</h2>
            </div>
            {% endif %}

            <!-- Loop Through Text Subsections -->
            <div class="col-md-8 offset-md-2">
                {% for section in include.data.sections %}
                {% if section.subtitle %}
                <h3 class="mt-4">{{ section.subtitle }}</h3>
                {% endif %}
                {% if section.text %}
                <p class="lead-text">{{ section.text }}</p>
                {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>
</div>
