{% assign header = site.data.headers.home %}

<header class="project-header d-flex align-items-center justify-content-center py-5"
    style="background-color: {{ header.theme_color | default: 'var(--accent)' }}; min-height: 70vh;">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                {% if header.logotype %}
                <img src="{{ header.logotype }}" alt="{{ header.alt | default: site.title }}"
                    class="img-fluid mb-4 px-3" style="max-width: 320px; height: auto;" width="320" height="80"
                    decoding="async" fetchpriority="high">
                {% endif %}

                {% if header.title %}
                <h2 class="text-balance mb-4" style="color: var(--dark);">{{ header.title }}</h2>
                {% endif %}

                {% if header.subtitle %}
                <h5 class="fw-light mb-0" style="color: var(--dark);">{{ header.subtitle }}</h5>
                {% endif %}
            </div>
        </div>
    </div>
</header>
