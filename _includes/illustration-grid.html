<!-- Grid Row -->
<div class="row p-0">
    {% for work in site.data.illustrations %}
    <div class="col-6 col-lg-3 p-0 portfolio-frame">
        <a href="{{ work.url }}">
            <picture>
                <!-- Modern formats first -->
                {% if work.thumb.avif %}
                <source srcset="{{ work.thumb.avif }}" type="image/avif">{% endif %}
                {% if work.thumb.webp %}
                <source srcset="{{ work.thumb.webp }}" type="image/webp">{% endif %}
                <!-- Fallback -->
                <img decoding="async" class="img-fluid portfolio-image" loading="lazy" src="{{ work.thumb.jpg }}"
                    alt="{{ work.thumb.alt | default: work.title }}" width="400">
            </picture>
        </a>
    </div>
    {% endfor %}
</div>
