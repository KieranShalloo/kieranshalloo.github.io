<!-- Grid Row -->
<div class="row p-0">
    {% for item in site.data.illustrations %}
    <div class="col-6 col-lg-3 p-0 portfolio-frame">
        <a href="{{ item.url }}">
            {% assign img_name = item.thumb.jpg | replace: '/images/', '' | replace: '.jpg', '' %}
            {% include responsive-image.html
            name=img_name
            alt=item.thumb.alt
            width=400 %}
            <!-- Optional: Add title overlay if desired -->
            <!-- <div class="portfolio-overlay">
                <div class="portfolio-title">{{ item.title }}</div>
            </div> -->
        </a>
    </div>
    {% endfor %}
</div>


</div>
