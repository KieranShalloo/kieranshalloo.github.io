<section class="container-fluid portfolio-component {% if include.block.is_fullwidth %}nopadding{% endif %}">
    <div class="container {% if include.block.is_fullwidth %}fullwidthimage{% endif %}">
        <div class="row align-items-center {% if include.block.centered %}justify-content-center{% endif %}">

            {% for item in include.block.images %}
            <div class="col-12 col-md-{{ include.block.columns | default: 6 }}">
                <figure class="portfolio-media-container m-0">
                    <picture>
                        {% if item.responsive %}
                        <source media="(max-width: 414px)"
                            srcset="{{ item.path | replace: '.jpg', '-414.webp' | replace: '.png', '-414.webp' | relative_url }}"
                            type="image/webp">
                        <source media="(max-width: 1024px)"
                            srcset="{{ item.path | replace: '.jpg', '-768.webp' | replace: '.png', '-768.webp' | relative_url }}"
                            type="image/webp">
                        <source media="(min-width: 1025px)"
                            srcset="{{ item.path | replace: '.jpg', '-1920.webp' | replace: '.png', '-1920.webp' | relative_url }}"
                            type="image/webp">
                        {% endif %}

                        <img src="{{ item.path | relative_url }}" alt="{{ item.alt | default: page.title | escape }}"
                            loading="lazy" decoding="async">
                    </picture>

                    {% if item.caption %}
                    <figcaption class="figure-caption text-center mt-3">{{ item.caption }}</figcaption>
                    {% endif %}
                </figure>
            </div>
            {% endfor %}

        </div>
    </div>
</section>
