{% comment %} Derive current section directly from page.url {% endcomment %}
{% assign url_parts = page.url | split: '/' %}
{% assign current_section = url_parts[1] %}

<nav class="navbar navbar-expand-md navbar-light bg-light shadow sticky-top p-0">
    <div class="container p-2">
        <!-- Mobile logo (hidden on desktop) -->
        <a class="navbar-brand d-md-none" href="/" aria-label="Kieran Shalloo Design - Home">
            <img src="/Logotype.svg" alt="Kieran Shalloo Design Logo" width="50" height="50" loading="eager">
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar content -->
        <div class="collapse navbar-collapse justify-content-center" id="mainNavbar">
            <ul class="navbar-nav align-items-center">

                <!-- Left side items -->
                <li class="nav-item">
                    <a class="nav-link {% if current_section == 'portfolio' %}active{% endif %}" href="/portfolio/" {%
                        if current_section=='portfolio' %}aria-current="page" {% endif %}>
                        Design Work
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if current_section == 'process' %}active{% endif %}" href="/process/" {% if
                        current_section=='process' %}aria-current="page" {% endif %}>
                        Design Process
                    </a>
                </li>

                <!-- Center logo (hidden on mobile) -->
                <li class="nav-item d-none d-md-block mx-2 mx-lg-4">
                    <a class="navbar-brand p-0" href="/" aria-label="Kieran Shalloo Design - Home">
                        <img src="/Logotype.svg" alt="Kieran Shalloo Design Logo" width="70" height="70"
                            loading="eager">
                    </a>
                </li>

                <!-- Right side items -->
                <li class="nav-item">
                    <a class="nav-link {% if current_section == 'illustration' %}active{% endif %}"
                        href="/illustration/" {% if current_section=='illustration' %}aria-current="page" {% endif %}>
                        Illustration
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if current_section == 'traditionalprintmaking' %}active{% endif %}"
                        href="/traditionalprintmaking/" {% if current_section=='traditionalprintmaking'
                        %}aria-current="page" {% endif %}>
                        Printmaking
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>
