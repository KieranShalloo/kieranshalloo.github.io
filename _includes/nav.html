{% comment %} Derive current section directly from page.url {% endcomment %}
{% assign url_parts = page.url | split: '/' %}
{% assign current_section = url_parts[1] %}

<nav class="navbar navbar-expand-md shadow sticky-top p-0">
    <div class="container p-2">
        <!-- Animated Switch Toggle -->
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="theme-checkbox" aria-label="Toggle dark and light mode">
                <input type="checkbox" id="theme-checkbox">
                <span class="theme-slider">
                    <span class="slider-icon sun-icon">☀️</span>
                    <span class="slider-icon moon-icon">🌙</span>
                </span>
            </label>
        </div>

        <!-- Mobile logo -->
        <a class="navbar-brand d-md-none" href="/" aria-label="Kieran Shalloo Design - Home">
            <img src="/Logotype.svg" alt="" width="50" height="50" loading="eager" class="navbar-logo"
                aria-hidden="true">
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar content -->
        <div class="collapse navbar-collapse justify-content-center" id="mainNavbar">
            <ul class="navbar-nav align-items-center" role="menubar">

                <!-- Left side items -->
                <li class="nav-item" role="none">
                    <a class="nav-link {% if current_section == 'portfolio' %}active{% endif %}" href="/portfolio/"
                        role="menuitem" {% if current_section=='portfolio' %}aria-current="page" {% endif %}>
                        Design Work
                    </a>
                </li>

                <li class="nav-item" role="none">
                    <a class="nav-link {% if current_section == 'process' %}active{% endif %}" href="/process/"
                        role="menuitem" {% if current_section=='process' %}aria-current="page" {% endif %}>
                        Design Process
                    </a>
                </li>

                <!-- Center logo -->
                <li class="nav-item d-none d-md-block mx-3 mx-lg-4" role="none">
                    <a class="navbar-brand p-0" href="/" aria-label="Kieran Shalloo Design - Home">
                        <img src="/Logotype.svg" alt="" width="70" height="70" loading="eager" class="navbar-logo"
                            aria-hidden="true">
                    </a>
                </li>

                <!-- Right side items -->
                <li class="nav-item" role="none">
                    <a class="nav-link {% if current_section == 'illustration' %}active{% endif %}"
                        href="/illustration/" role="menuitem" {% if current_section=='illustration'
                        %}aria-current="page" {% endif %}>
                        Illustration
                    </a>
                </li>

                <li class="nav-item" role="none">
                    <a class="nav-link {% if current_section == 'traditionalprintmaking' %}active{% endif %}"
                        href="/traditionalprintmaking/" role="menuitem" {% if current_section=='traditionalprintmaking'
                        %}aria-current="page" {% endif %}>
                        Printmaking
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const checkbox = document.getElementById('theme-checkbox');
        const htmlEl = document.documentElement;

        const updateUI = (theme) => {
            htmlEl.setAttribute('data-bs-theme', theme);
            checkbox.checked = (theme === 'dark');
        };

        // Sync initial state based on what the head script applied
        updateUI(htmlEl.getAttribute('data-bs-theme') || 'light');

        checkbox.addEventListener('change', () => {
            const nextTheme = checkbox.checked ? 'dark' : 'light';
            localStorage.setItem('theme', nextTheme);
            updateUI(nextTheme);
        });
    });
</script>
