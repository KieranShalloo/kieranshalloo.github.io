{% assign loading = include.loading | default: 'lazy' %}
{% assign decoding = include.decoding | default: 'async' %}
{% assign use_sizes = include.sizes | default: true %}
{% assign img_width = include.width | default: 768 %}

<figure class="{{ include.container_class | default: 'portfolio-image' }}">
  <picture>
    <!-- WebP Source with 2-point srcset -->
    <source type="image/webp" srcset="
        {{ '/images/' | append: include.name | append: '-768.webp' }} 768w,
        {{ '/images/' | append: include.name | append: '-1440.webp' }} 1440w
      " sizes="(max-width: 768px) 768px, 1440px">

    <!-- JPEG Fallback with 2-point srcset -->
    <img src="{{ '/images/' | append: include.name | append: '-768.jpg' }}" srcset="
        {{ '/images/' | append: include.name | append: '-768.jpg' }} 768w,
        {{ '/images/' | append: include.name | append: '-1440.jpg' }} 1440w
      " sizes="(max-width: 768px) 768px, 1440px" width="{{ img_width }}" decoding="{{ decoding }}"
      loading="{{ loading }}" class="img-fluid {{ include.class }}" alt="{{ include.alt | escape }}">
  </picture>
</figure>
