<!DOCTYPE html>
<html lang="en" data-bs-theme="{% if page.dark_theme %}dark{% else %}light{% endif %}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="/Logotype.svg" as="image" fetchpriority="high">




    {% include head-styles.html %}

    {% if page.has_assets %}
    {% if page.has_lottie %}
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js" defer></script>
    {% endif %}

    {% if page.has_video %}
    <script type="module" src="https://cdn.jsdelivr.net/npm/@slightlyoff/lite-vimeo@0.1.1/lite-vimeo.js" defer></script>
    {% endif %}
    {% endif %}


</head>

<body>
    {% include nav.html %}

    <main id="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" defer></script>
</body>

</html>
